name: Publicar el sitio

# El sitio es estático: este workflow testea, compila y sube `dist/` a GitHub Pages.
# No hay secretos en juego. Los datos no se bajan acá: cada visitante los consulta en vivo
# al MCP con su propia cuenta (ver docs/decisiones/0001).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Tipos, tests unitarios y build.
      - run: npm run verificar

      # El informe completo en un navegador, con el MCP simulado desde respuestas reales.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
